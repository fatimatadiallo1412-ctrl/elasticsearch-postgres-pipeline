    statement => "SELECT *, 'inscriptions' AS source_table FROM inscriptions"
  }
  jdbc {
    jdbc_driver_library => "/usr/share/logstash/drivers/postgresql-42.7.3.jar"
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_connection_string => "jdbc:postgresql://postgres:5432/edusmart_academic"
    jdbc_user => "postgres"
    jdbc_password => "${POSTGRES_PASSWORD}"
    statement => "SELECT *, 'paiements' AS source_table FROM paiements"
  }
}

filter {
  if [source_table] == "etudiants" {

    ruby {
      code => '
        sexe = event.get("sexe")
        if sexe.nil?
          event.set("sexe", "Inconnu")
        else
          sexe_clean = sexe.to_s.strip.downcase
          if ["m", "masculin", "homme", "1"].include?(sexe_clean)
            event.set("sexe", "M")
          elsif ["f", "feminin", "femme", "0"].include?(sexe_clean)
            event.set("sexe", "F")
          else
            event.set("sexe", "Inconnu")
          end
        end
      '
    }

    if [telephone] == "" {
      mutate {
        replace => { "telephone" => "Non renseigné" }
      }
    }

    ruby {
      code => '
        require "date"
        dn = event.get("date_naissance")
        if dn
          begin
            date_val = DateTime.parse(dn.to_s)
            if date_val > DateTime.now
              event.cancel
            end
          rescue
          end
        end
      '
    }

  }

  if [source_table] == "paiements" {

    ruby {
      code => '
        mode = event.get("mode_paiement")
        if mode
          mode_clean = mode.to_s.strip.downcase
          if ["om", "orange money", "orange_money"].include?(mode_clean)
            event.set("mode_paiement", "Orange Money")
          elsif mode_clean == "wave"
            event.set("mode_paiement", "Wave")
          elsif mode_clean == "espèces" || mode_clean == "especes"
            event.set("mode_paiement", "Espèces")
          elsif mode_clean == "virement"
            event.set("mode_paiement", "Virement")
          elsif mode_clean == "chèque" || mode_clean == "cheque"
            event.set("mode_paiement", "Chèque")
          end
        end
      '
    }

    if ![statut] or [statut] == "" {
      mutate {
        replace => { "statut" => "Inconnu" }
      }
    }

    ruby {
      code => '
        montant = event.get("montant").to_f
        if montant <= 0 || montant > 5000000
          event.cancel
        end
      '
    }

  }

  if [source_table] == "inscriptions" {

    ruby {
      code => '
        type_ins = event.get("type_inscription")
        if type_ins.nil?
          event.set("type_inscription", "Inconnu")
        else
          type_clean = type_ins.to_s.strip.downcase
          if type_clean == "nouvelle"
            event.set("type_inscription", "Nouvelle")
          elsif type_clean == "reinscription"
            event.set("type_inscription", "Réinscription")
          else
            event.set("type_inscription", "Inconnu")
          end
        end
      '
    }

    if ![bourse] {
      mutate {
        replace => { "bourse" => false }
      }
    }

    ruby {
      code => '
        reduction = event.get("reduction").to_f
        if reduction < 0
          event.cancel
        end
      '
    }

  }

  if [source_table] == "classes" {

    mutate {
      gsub => [
        "salle", "Salle ", "",
        "salle", "-", ""
      ]
    }

    ruby {
      code => '
        capacite = event.get("capacite").to_i
        if capacite > 100
          event.set("capacite_anomalie", true)
        else
          event.set("capacite_anomalie", false)
        end
      '
    }

    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "filieres"
      query => "id_filiere:\"%{id_filiere}\""
      fields => { "id_filiere" => "filiere_trouvee" }
    }

    ruby {
      code => '
        if event.get("filiere_trouvee").nil?
          event.set("filiere_valide", false)
        else
          event.set("filiere_valide", true)
        end
      '
    }

  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "%{source_table}"
  }
}